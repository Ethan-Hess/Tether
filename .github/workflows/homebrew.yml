name: Update Homebrew cask

# This repository is also the Homebrew tap (users run `brew tap ethan-hess/tether <this repo's URL>`).
# When a release is published, render the cask for it and open a pull request that adds it to
# Casks/tether.rb. Pull requests opened with the workflow's own token don't start CI by themselves,
# so this workflow starts CI on the PR's branch by hand; those results attach to the pull request and
# satisfy the required checks. Then merge the PR.
# (Publishing by hand triggers this; a release made with the workflow's own token would not.)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to put in the cask (for example v0.1.0)
        required: true

# One cask update at a time.
concurrency:
  group: cask-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # push the cask branch
      pull-requests: write  # open the pull request
      actions: write        # start CI on that branch
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' must look like v1.2.3"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BRANCH=cask/tether-${TAG#v}" >> "$GITHUB_ENV"

      # The cask template and script come from the release's own commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: release

      - name: Hash the released DMG
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Tether-$VERSION.dmg" --dir dl
          echo "SHA256=$(shasum -a 256 "dl/Tether-$VERSION.dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Render the cask
        run: |
          ./release/scripts/render-cask.sh "$VERSION" "$SHA256" > tether.rb
          ruby -c tether.rb
          cat tether.rb

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          path: tap

      - name: Commit the cask to a branch
        id: commit
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../tether.rb Casks/tether.rb
          if git diff --quiet -- Casks/tether.rb && git ls-files --error-unmatch Casks/tether.rb > /dev/null 2>&1; then
            echo "The cask already has this version."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "tether-release"
          git config user.email "tether-release@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Casks/tether.rb
          git commit -m "Cask: tether $VERSION"
          # The branch belongs to this workflow, so a re-run may replace it.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: tap
        run: |
          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]]; then
            echo "A pull request for $BRANCH is already open."
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Cask: tether $VERSION" \
              --body "Adds the Homebrew cask for release $TAG (SHA-256 \`$SHA256\`), generated from \`Packaging/homebrew/tether.rb.in\` by the *Update Homebrew cask* workflow. CI is started on this branch by hand because pull requests opened by a workflow don't trigger it. Merge when the checks pass."
          fi

      # Events caused by the workflow token don't start workflows, except workflow_dispatch.
      - name: Start CI on the branch
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
