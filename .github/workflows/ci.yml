name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Swift Testing needs Xcode 16+, which rules out macos-14's default image.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        id: tc
        run: |
          swift --version
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr -s ' \n' '--')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ matrix.os }}-${{ steps.tc.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ matrix.os }}-${{ steps.tc.outputs.xcode }}-

      - name: Tests
        run: ./scripts/test.sh

      - name: Release build of every product
        run: swift build -c release

  app-bundle:
    name: app-bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Toolchain
        id: tc
        run: echo "xcode=$(xcodebuild -version | tr -s ' \n' '--')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-bundle-${{ steps.tc.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-bundle-${{ steps.tc.outputs.xcode }}-

      - name: Build Tether.app (without the 1 GB runtime)
        run: ./scripts/package-app.sh --no-runtime

      - name: Verify the bundle
        run: ./scripts/verify-app.sh build/Tether.app

      - name: Zip the app
        run: ditto -c -k --keepParent build/Tether.app build/Tether-no-runtime.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Tether-no-runtime
          path: build/Tether-no-runtime.zip
          retention-days: 7
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning scripts/*.sh

      - name: JSON files
        run: |
          for f in Sources/TetherKit/Resources/Runtimes/catalog.json \
                   Sources/TetherKit/Resources/Notices/components.json \
                   Sources/TetherKit/Resources/Profiles/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
